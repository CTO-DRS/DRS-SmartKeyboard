name: DRS Smart Keyboard Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # DRS P1 (roadmap phase 1): reusable entry point so the weekly-beta
  # automation can cut a signed release after its own version bump. This
  # sidesteps the GITHUB_TOKEN recursion rule (token-triggered tag pushes
  # do not start new workflow runs).
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag (v…). Required when called as a reusable workflow.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve release tag & prerelease flag
        run: |
          # Tag source: workflow_call input, else the pushed tag itself.
          TAG="${{ inputs.tag_name || github.ref_name }}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=DRS Smart Keyboard V ${TAG#v}" >> "$GITHUB_ENV"
          # ADR 0003: anything carrying -beta/-rc/-alpha is a prerelease and
          # must never be advertised as the repo's latest stable release.
          if [[ "${TAG}" =~ -(beta|rc|alpha) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "MAKE_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "MAKE_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Assert release tag matches gradle.properties version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_call'
        run: |
          TAG="${TAG#v}"
          echo "Tag version: $TAG"
          grep -E "^projectVersionName=${TAG//./\\.}$" gradle.properties \
            || { echo "::error::gradle.properties projectVersionName does not match tag v$TAG"; exit 1; }
          grep -E "^projectVersionCode=[0-9]+$" gradle.properties \
            || { echo "::error::projectVersionCode missing or invalid in gradle.properties"; exit 1; }

      - name: Run unit tests + coverage floor (release gate, DRS M0.5)
        run: ./gradlew --no-daemon testDebugUnitTest :app:koverVerifyDebug --stacktrace

      # DRS v1.21.0: the release path had no static-analysis step at all —
      # lint reports now build with every release (non-fatal while the
      # existing baseline is noisy, but produced for review).
      - name: Lint release build (report)
        run: ./gradlew --no-daemon lintRelease --stacktrace || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing keystore
        env:
          DRS_KEYSTORE_B64: ${{ secrets.DRS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$DRS_KEYSTORE_B64" | base64 -d > keystore/DRS-Release-Key.keystore
          test -s keystore/DRS-Release-Key.keystore

      - name: Build signed release APK & AAB
        env:
          DRS_KEYSTORE_PASSWORD: ${{ secrets.DRS_KEYSTORE_PASSWORD }}
          DRS_KEY_ALIAS: ${{ secrets.DRS_KEY_ALIAS }}
          DRS_KEY_PASSWORD: ${{ secrets.DRS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          TAG="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "dist/DRS-Smart-Keyboard-v${TAG}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/DRS-Smart-Keyboard-v${TAG}.aab"
          fi
          # Official packages for the DRS Package Center
          if compgen -G "packages/pkg-*.flex" > /dev/null; then
            cp packages/pkg-*.flex dist/
          fi
          ls -la dist/

      # DRS v1.22.0: a manual workflow_dispatch run built signed binaries
      # and then threw them away with the runner — the only publishing path
      # was a v* tag. Manual runs now keep the signed APK/AAB as workflow
      # artifacts (tag runs still publish the real GitHub Release).
      - name: Upload signed artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: drs-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Select release body (stable vs beta)
        run: |
          if [ "${IS_PRERELEASE}" = "true" ] && [ -f .github/RELEASE_BODY_BETA.md ]; then
            echo "BODY_PATH=.github/RELEASE_BODY_BETA.md" >> "$GITHUB_ENV"
          else
            echo "BODY_PATH=.github/RELEASE_BODY.md" >> "$GITHUB_ENV"
          fi

      - name: Publish GitHub Release with artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: ${{ env.BODY_PATH }}
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.flex
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
