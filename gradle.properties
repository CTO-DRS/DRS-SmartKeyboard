# DRS Smart Keyboard — build configuration (v2.2.0 / versionCode 14)
# First public release: this file is intentionally lean. Release history
# lives in CHANGELOG.md; signing/trust policy lives in docs/adr/0003 and
# docs/adr/0007. Secrets (release seed, keystore) never enter git.

android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx1800m -XX:MaxMetaspaceSize=512m
org.gradle.warning.mode=all
projectMinSdk=26
projectTargetSdk=36
projectCompileSdk=36
projectVersionCode=15
projectVersionName=2.2.1
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
